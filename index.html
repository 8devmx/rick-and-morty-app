<!DOCTYPE html>
<html lang="es-MX">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick and Morty</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <div class="logo">
      <h1>Rick and Morty</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Characters</a></li>
        <li><a href="#">Episodes</a></li>
      </ul>
    </nav>
  </header>
  <div id="app">
    <div class="characters"></div>
    <div id="pagination"></div>

    <div id="character-modal" class="modal" aria-hidden="true">

      <div id="character-detail"></div>
    </section>
  </div>
  <footer>
    <p>Creado con ❤️ por los alumnos reprobados de Ingeniería de Requisitos de la UNID</p>
