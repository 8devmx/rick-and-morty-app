<!DOCTYPE html>
<html lang="es-MX">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick and Morty</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <div class="logo">
      <h1>Rick and Morty</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#" data-view="home">Home</a></li>
        <li><a href="#" data-view="characters">Characters</a></li>
        <li><a href="#" data-view="episodes">Episodes</a></li>
      </ul>
    </nav>
  </header>
  <div id="app">
    <section id="home" class="view">
      <div class="hero">
        <h2>Bienvenido a Rick and Morty</h2>
        <p>Explora los personajes y episodios de la serie.</p>
      </div>
    </section>
    <section id="characters" class="view">
      <div class="characters"></div>
      <div id="pagination"></div>
    </section>
    <section id="episodes" class="view">
      <div class="episodes"></div>
      <div id="episode-pagination"></div>
    </section>
  </div>
  <footer>
    <p>Creado con ❤️ por los alumnos reprobados de Ingeniería de Requisitos de la UNID</p>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>

</html>
